---
applications:
  # Public DCAT-US validation API. No database, no authentication. Reached
  # only over the internal route from datagov-harvest-proxy, which forwards
  # harvest.data.gov/api/v1/validate here - for external callers and for the
  # harvester's /validate/ page, whose browser fetch()es that path. The
  # network policy (61443) is added from datagov-harvester's release workflow.
  #
  # ((route_external)) is not bound yet - validator-{dev,staging}.data.gov
  # and validator.data.gov need a new custom domain registered on cloud.gov
  # (DNS + `cf create-domain`/`external-domain` service) before it can be.
  # EXTERNAL_ROUTE below only sets the OpenAPI spec's server URL, so this is
  # safe to defer.
  - name: ((app_name))
    buildpacks:
      - python_buildpack
    routes:
      - route: ((route_internal))
    services:
      - ((app_name))-secrets
      - logstack-space-drain
    instances: ((instances))
    memory: ((memory_quota))
    disk_quota: ((disk_quota))
    health-check-type: http
    health-check-http-endpoint: /health
    env:
      FLASK_APP: run.py
      FLASK_ENV: production
      EXTERNAL_ROUTE: ((route_external))
      NEW_RELIC_APP_NAME: ((app_name))-((space_name))
      NEW_RELIC_HOST: gov-collector.newrelic.com
      NEW_RELIC_MONITOR_MODE: ((new_relic_monitor_mode))
      NEW_RELIC_CONFIG_FILE: /home/vcap/app/config/newrelic.ini
      SERVED_BY: ((app_name))
    command: ./app-start.sh
