name: 1 - Commit
on: [push]

permissions:
  contents: read

env:
  PY_VERSION: "3.12.14"
  POETRY_VERSION: "latest"

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Python Lint
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: true
      - name: Set up Python ${{ env.PY_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PY_VERSION }}

      - name: Install Poetry
        uses: abatilo/actions-poetry@v4
        with:
          poetry-version: ${{ env.POETRY_VERSION }}
          poetry-plugins: "poetry-plugin-export"

      - name: Install Dependencies
        run: |
          poetry env use ${{ env.PY_VERSION }}
          poetry install

      - name: Run linting
        run: make lint-check

  test:
    runs-on: ubuntu-latest
    name: Pytests
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # the DCAT-US 3.0 schemas the tests validate against
          submodules: true
      - name: Set up Python ${{ env.PY_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PY_VERSION }}

      - name: Install Poetry
        uses: abatilo/actions-poetry@v4
        with:
          poetry-version: ${{ env.POETRY_VERSION }}
          poetry-plugins: "poetry-plugin-export"

      - name: Install Dependencies
        run: |
          poetry env use ${{ env.PY_VERSION }}
          poetry install

      - name: Run Pytest
        run: make test
